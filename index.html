<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workout Counter & Tracker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        appBg: '#0D0F14',
                        cardBg: '#151820',
                        accent: '#FF9F0A',
                        accentOrange: '#FF7A00',
                        textMain: '#FFFFFF',
                        textSec: '#8B909A',
                        danger: '#FF453A',
                        success: '#34C759'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Custom CSS File linkage -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased h-screen w-screen overflow-hidden flex flex-col justify-center items-center bg-[#07080a]">
    <div id="root" class="h-full w-full max-w-md bg-appBg relative flex flex-col overflow-hidden shadow-2xl"></div>

    <!-- Externalized App Script -->
    <script type="text/babel" src="app.js"></script>
</body>
</html>
